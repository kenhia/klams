name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Sprint 040 (#792): PRs keep fast-cancel; `main` does not. Two pushes
  # land on main per sprint ship (the merge commit, then the deploy
  # record), and blanket cancellation meant the second killed the first —
  # so the commit actually carrying the sprint's code never completed a
  # run, on every sprint since at least 033. `perf` is main-only and
  # ~7 min against a ~2 min cancel, so it only ever measured the docs
  # commit. The deploy-record commit now also carries `[skip ci]`, so in
  # practice main gets one run per ship, not two.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  service:
    name: service (fmt + clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service

      # Sprint 031 (#646): the integration stack runs on EVERY branch,
      # not just main. It was main-only, so every integration failure
      # was discovered after merge — by which point the change is in
      # `main` and the bisect starts. The disk pressure that motivated
      # the main-only guard is real (the stack plus cargo artifacts is
      # tight on a ubuntu-latest runner), so the prune below now runs
      # always rather than being dropped.
      - name: Free up disk space for test stack
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          echo "=== Removing system packages and old docker artifacts ==="
          docker system prune -f --volumes || true
          docker image prune -f --all || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install just
        # Sprint 040 (#788): was `cargo install just --locked`, which
        # built from source for 91 s on every run — in a job that then
        # never invoked `just`. This is a composite action (no Node
        # runtime) wrapping a SHA-pinned download of a `casey/just`
        # release, so it costs ~1 s and adds no annotation.
        uses: extractions/setup-just@v4

      - name: just gate (fmt + clippy + tests)
        # Sprint 040 (#788): CI now runs the recipe rather than its own
        # copy of the three commands, so the justfile is the single
        # definition of the gate. The two were byte-identical when this
        # landed — running the recipe is what keeps them that way.
        run: just gate

      # Sprint 040 (#789): the stack comes up HERE, not at the top of the
      # job. It used to start before the compile gate, so Postgres,
      # Qdrant and TEI idled ~8 minutes under exactly the disk pressure
      # the rest of this workflow works around.
      - name: Bring up test stack
        uses: ./.github/actions/test-stack

      - name: cargo test --ignored (integration)
        env:
          TEST_DATABASE_URL: postgres://klams:klams_test@127.0.0.1:55432/klams
          TEST_QDRANT_URL: http://127.0.0.1:56334
          TEST_TEI_URL: http://127.0.0.1:57070
          # The TEI test service also serves an OpenAI-compatible /v1
          # route; point the openai-compat embedder integration test at
          # it so that path (sprint 014) gets real coverage instead of
          # panicking on an unset var (sprint 022 — main-CI fix).
          TEST_OPENAI_EMBED_URL: http://127.0.0.1:57070/v1
          TEST_OPENAI_EMBED_MODEL: BAAI/bge-small-en-v1.5
        # Sprint 031 (#679): `--test-threads=1` is gone. The shared-table
        # race that required it is fixed — isolated tests now migrate
        # into their own Postgres schema instead of TRUNCATEing the
        # shared one. Serial execution would roughly triple this step's
        # wall clock, which matters now that it runs on every PR.
        #
        # The perf test keeps its `--skip` here and runs in its own job
        # below; it takes ~5 minutes and is a latency measurement, not a
        # correctness check (#646).
        run: cargo test --workspace -- --ignored --skip search_p95_under_500ms_at_mvp_corpus

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

      - name: Clean up docker images and dangling layers
        if: always()
        run: |
          echo "=== Docker disk before cleanup ==="
          docker system df || true
          echo "=== Pruning unused images, containers, and volumes ==="
          docker system prune -f --volumes --all || true
          echo "=== Docker disk after cleanup ==="
          docker system df || true

  perf:
    name: perf (search p95 at MVP corpus)
    # Sprint 031 (#646): the SC-003 latency budget used to be `--skip`ped
    # even on main, which is the same lie as a test that never runs — it
    # read as covered and was not.
    #
    # It was NOT deleted, because it works: measured locally it seeds the
    # 10k/50k/10k corpus and asserts p95 < 500 ms in ~5 minutes, and it
    # passes. What it is not is a per-PR gate — five minutes on every push
    # to measure a number that moves with runner weather is a bad trade,
    # and a p95 measured on shared CI hardware is noisy enough that a
    # failure needs a human to read it rather than a red X.
    #
    # So: main only, its own job so it cannot slow or flake the branch
    # gate, and non-blocking. If it starts failing consistently, that is
    # a signal worth a work item, not an emergency.
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service

      - name: Free up disk space
        run: |
          docker system prune -f --volumes || true
          docker image prune -f --all || true
          df -h /

      - name: Bring up test stack
        uses: ./.github/actions/test-stack

      - name: search_p95_under_500ms_at_mvp_corpus
        env:
          TEST_DATABASE_URL: postgres://klams:klams_test@127.0.0.1:55432/klams
          TEST_QDRANT_URL: http://127.0.0.1:56334
          TEST_TEI_URL: http://127.0.0.1:57070
        run: |
          cargo test --release -p klams-service --test perf_smoke -- \
            --ignored --nocapture search_p95_under_500ms_at_mvp_corpus

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v
