name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service (fmt + clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service

      # Sprint 031 (#646): the integration stack runs on EVERY branch,
      # not just main. It was main-only, so every integration failure
      # was discovered after merge — by which point the change is in
      # `main` and the bisect starts. The disk pressure that motivated
      # the main-only guard is real (the stack plus cargo artifacts is
      # tight on a ubuntu-latest runner), so the prune below now runs
      # always rather than being dropped.
      - name: Free up disk space for test stack
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          echo "=== Removing system packages and old docker artifacts ==="
          docker system prune -f --volumes || true
          docker image prune -f --all || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Report disk space before test stack
        run: |
          echo "=== Disk usage before test stack ==="
          df -h /
          echo "=== Docker disk usage ==="
          docker system df || true

      - name: Bring up test stack
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for test stack
        # Probe published ports from the host rather than reading
        # `docker compose ps`'s health column. Sprint 031 (#672) fixed
        # the qdrant healthcheck (it shelled out to a curl the image
        # does not ship, so it was permanently "unhealthy"), but the
        # host probe stays: it also covers TEI's multi-minute model
        # load, which no container healthcheck timeout wants to span.
        # pg_isready and curl are preinstalled on ubuntu-latest.
        run: |
          set -e
          echo -n "postgres: "
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          echo -n "qdrant:   "
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:56333/readyz >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          echo -n "tei:      "
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:57070/health >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          # Final verification — fail loudly if any service is still unresponsive
          pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null \
            || { echo "postgres unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          curl -fsS http://127.0.0.1:56333/readyz >/dev/null \
            || { echo "qdrant unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          curl -fsS http://127.0.0.1:57070/health >/dev/null \
            || { echo "tei unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          echo "stack ready"

      - name: Install just
        run: cargo install just --locked

      - name: cargo fmt + clippy + tests (just gate, without --all-features to save disk)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: cargo test --ignored (integration)
        env:
          TEST_DATABASE_URL: postgres://klams:klams_test@127.0.0.1:55432/klams
          TEST_QDRANT_URL: http://127.0.0.1:56334
          TEST_TEI_URL: http://127.0.0.1:57070
          # The TEI test service also serves an OpenAI-compatible /v1
          # route; point the openai-compat embedder integration test at
          # it so that path (sprint 014) gets real coverage instead of
          # panicking on an unset var (sprint 022 — main-CI fix).
          TEST_OPENAI_EMBED_URL: http://127.0.0.1:57070/v1
          TEST_OPENAI_EMBED_MODEL: BAAI/bge-small-en-v1.5
        # Sprint 031 (#679): `--test-threads=1` is gone. The shared-table
        # race that required it is fixed — isolated tests now migrate
        # into their own Postgres schema instead of TRUNCATEing the
        # shared one. Serial execution would roughly triple this step's
        # wall clock, which matters now that it runs on every PR.
        #
        # The perf test keeps its `--skip` here and runs in its own job
        # below; it takes ~5 minutes and is a latency measurement, not a
        # correctness check (#646).
        run: cargo test --workspace -- --ignored --skip search_p95_under_500ms_at_mvp_corpus

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

      - name: Clean up docker images and dangling layers
        if: always()
        run: |
          echo "=== Docker disk before cleanup ==="
          docker system df || true
          echo "=== Pruning unused images, containers, and volumes ==="
          docker system prune -f --volumes --all || true
          echo "=== Docker disk after cleanup ==="
          docker system df || true

  perf:
    name: perf (search p95 at MVP corpus)
    # Sprint 031 (#646): the SC-003 latency budget used to be `--skip`ped
    # even on main, which is the same lie as a test that never runs — it
    # read as covered and was not.
    #
    # It was NOT deleted, because it works: measured locally it seeds the
    # 10k/50k/10k corpus and asserts p95 < 500 ms in ~5 minutes, and it
    # passes. What it is not is a per-PR gate — five minutes on every push
    # to measure a number that moves with runner weather is a bad trade,
    # and a p95 measured on shared CI hardware is noisy enough that a
    # failure needs a human to read it rather than a red X.
    #
    # So: main only, its own job so it cannot slow or flake the branch
    # gate, and non-blocking. If it starts failing consistently, that is
    # a signal worth a work item, not an emergency.
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service

      - name: Free up disk space
        run: |
          docker system prune -f --volumes || true
          docker image prune -f --all || true
          df -h /

      - name: Bring up test stack
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for test stack
        run: |
          set -e
          for _ in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:57070/health >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null || { echo "postgres unreachable"; exit 1; }
          curl -fsS http://127.0.0.1:56333/readyz >/dev/null || { echo "qdrant unreachable"; exit 1; }
          curl -fsS http://127.0.0.1:57070/health >/dev/null || { echo "tei unreachable"; exit 1; }

      - name: search_p95_under_500ms_at_mvp_corpus
        env:
          TEST_DATABASE_URL: postgres://klams:klams_test@127.0.0.1:55432/klams
          TEST_QDRANT_URL: http://127.0.0.1:56334
          TEST_TEI_URL: http://127.0.0.1:57070
        run: |
          cargo test --release -p klams-service --test perf_smoke -- \
            --ignored --nocapture search_p95_under_500ms_at_mvp_corpus

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

  viewport:
    name: viewport (svelte + tauri checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo (viewport)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: viewport
          workspaces: viewport/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: viewport/pnpm-lock.yaml

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: pnpm install
        working-directory: viewport
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        working-directory: viewport
        run: pnpm check

      - name: Build SvelteKit (needed for tauri context)
        working-directory: viewport
        run: pnpm build

      - name: cargo fmt --check (viewport)
        working-directory: viewport/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (viewport)
        working-directory: viewport/src-tauri
        run: cargo clippy --all-targets --features custom-protocol -- -D warnings

      - name: cargo test (viewport)
        working-directory: viewport/src-tauri
        run: cargo test --features custom-protocol
