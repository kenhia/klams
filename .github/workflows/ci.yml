name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service (fmt + clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service

      - name: Report disk space before test stack
        run: |
          echo "=== Disk usage before test stack ==="
          df -h /
          echo "=== Docker disk usage ==="
          docker system df || true

      - name: Bring up test stack
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for test stack
        # Probe published ports from the host. We do NOT rely on
        # `docker compose ps`'s health column because the qdrant image
        # ships without `curl`, so its in-container healthcheck never
        # reports `healthy` even when the service is fine (same gotcha
        # documented in .scratch/user-tests.md). pg_isready and curl
        # are preinstalled on ubuntu-latest runners.
        run: |
          set -e
          echo -n "postgres: "
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          echo -n "qdrant:   "
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:56333/readyz >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          echo -n "tei:      "
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:57070/health >/dev/null 2>&1; then
              echo "ok"; break
            fi
            sleep 1
          done
          # Final verification — fail loudly if any service is still unresponsive
          pg_isready -h 127.0.0.1 -p 55432 -U klams >/dev/null \
            || { echo "postgres unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          curl -fsS http://127.0.0.1:56333/readyz >/dev/null \
            || { echo "qdrant unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          curl -fsS http://127.0.0.1:57070/health >/dev/null \
            || { echo "tei unreachable"; docker compose -f tests/docker-compose.test.yml ps; exit 1; }
          echo "stack ready"

      - name: Install just
        run: cargo install just --locked

      - name: cargo fmt + clippy + tests (just gate, without --all-features to save disk)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: cargo test --ignored (integration)
        env:
          TEST_DATABASE_URL: postgres://klams:klams_test@127.0.0.1:55432/klams
          TEST_QDRANT_URL: http://127.0.0.1:56334
          TEST_TEI_URL: http://127.0.0.1:57070
        run: cargo test --workspace -- --ignored --test-threads=1 --skip search_p95_under_500ms_at_mvp_corpus

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

      - name: Clean up docker images and dangling layers
        if: always()
        run: |
          echo "=== Docker disk before cleanup ==="
          docker system df || true
          echo "=== Pruning unused images, containers, and volumes ==="
          docker system prune -f --volumes --all || true
          echo "=== Docker disk after cleanup ==="
          docker system df || true

  viewport:
    name: viewport (svelte + tauri checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo (viewport)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: viewport
          workspaces: viewport/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: viewport/pnpm-lock.yaml

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: pnpm install
        working-directory: viewport
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        working-directory: viewport
        run: pnpm check

      - name: Build SvelteKit (needed for tauri context)
        working-directory: viewport
        run: pnpm build

      - name: cargo fmt --check (viewport)
        working-directory: viewport/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (viewport)
        working-directory: viewport/src-tauri
        run: cargo clippy --all-targets --features custom-protocol -- -D warnings

      - name: cargo test (viewport)
        working-directory: viewport/src-tauri
        run: cargo test --features custom-protocol
