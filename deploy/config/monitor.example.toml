# klams-monitor configuration.
#
# The provision script renders a working copy of this file (url + token
# filled) into $KLAMS_ROOT/config/monitor.toml; for the systemd unit,
# deploy it as /etc/klams/monitor.toml and point the unit's
# Environment=KLAMS_CONFIG at it.

# klams service base URL (loopback).
url = "http://127.0.0.1:7777"

# Scoped monitor bearer ([[auth.tokens]] grant with scopes
# ["read", "write"] and agent_name = "klams-monitor", so the emitted
# Service events are attributable). Placeholder only.
token = "CHANGE-ME-monitor-bearer"

# Watched systemd units. klams-service.service is the one every install
# has; add whatever other units you want lifecycle events for (each
# state edge becomes a Service event in klams).
units = ["klams-service.service"]

# Poll cadence in seconds.
interval_secs = 30

# ── kpidash dashboard reporting (optional, sprint 010 / T024) ─────────
# Only relevant if you run a kpidash Redis dashboard. When enabled, the
# monitor polls <url>/healthz and publishes a status card to the Redis
# key `kpidash:services:<name>:<host>`. The whole section is inert when
# omitted — a config without it never connects to Redis and emits no
# warnings (the `kpidash` cargo feature is on by default; build with
# `--no-default-features` to drop the redis crate).
#
# [kpidash]
# redis_host   = "your-redis-host"
# redis_port   = 6379           # optional, default 6379
# name         = "klams"        # middle segment of the Redis key
# host         = "_"            # key host segment; "_" = no host line
# icon         = 8              # dashboard card icon index 0..15
# interval_secs = 30            # report cadence (own clock; default 30)
# healthz_url  = "http://127.0.0.1:7777/healthz"  # optional; defaults to url + /healthz
# Provide the Redis password via the REDISCLI_AUTH environment variable
# on the systemd unit (preferred, keeps it out of this file) or, as a
# fallback, an inline `password = "..."` key here.
