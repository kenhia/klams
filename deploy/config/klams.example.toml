# klams-service runtime configuration.
#
# Copy to $KLAMS_ROOT/config/klams.toml (provision script does this)
# and point the systemd unit's EnvironmentFile at it via KLAMS_CONFIG.

[server]
# Bind address for the HTTP API. Loopback by default; the systemd
# unit binds to a LAN interface in production.
listen_addr = "127.0.0.1"
port = 7777

[auth]
# Sprint 032 (#670) — this block used to LEAD with a `bearer_token`
# line, so every fresh install started life holding a full-admin
# credential nobody chose. It doesn't any more: scoped
# `[[auth.tokens]]` below are the path of least resistance, and the
# legacy form is opt-in break-glass.
#
# The legacy `[auth] bearer_token` still works and still materializes
# ONE grant carrying every scope — read + write + manage + admin. That
# is what it is for; it is deliberately not narrowed, because narrowing
# would silently strip capability from a deployment whose only
# credential it is. What changed is that you now have to ask for it.
#
# Two properties it cannot give you, which is why it should not be your
# daily driver:
#   * It declares no `agent_name`, so every write through it attributes
#     to the seeded `system` author rather than to anything traceable.
#   * It carries `manage` + `admin`, so it can cross-author delete,
#     hard-delete, restore, and run the author lifecycle.
# A scoped grant with `agent_name` gives you the same power where you
# want it and attribution everywhere.
#
# bearer_token = "changeme-32-byte-hex"   # break-glass only; see docs/auth.md

# Sprint 007 — scoped MCP tokens. THE DEFAULT. At least one of
# `bearer_token` or `[[auth.tokens]]` must be set or the service
# refuses to start. Every token MUST be ≥ 16 characters; `scopes`
# MUST be non-empty.
#
# SCOPES ARE FLAT, NOT HIERARCHICAL: "write" does not imply "read",
# and "admin" does not imply "write". List every scope a token needs.
#
#   read    queries and every GET
#   write   creating memories, and managing the ones THIS identity wrote
#   manage  curating ANOTHER author's memories (cross-author delete,
#           resolving dissents) — sprint 025
#   admin   restore / hard-delete / list-deleted / author lifecycle
#
# Full model: docs/auth.md.
#
# The viewport is a CURATION surface, not a display: it edits and
# deletes facts and it is where a human resolves dissents. It needs
# `manage`. Withholding `admin` is what bounds it — no hard deletes,
# no restores, no author lifecycle.
# [[auth.tokens]]
# token      = "viewport-XXXXXXXXXXXXXXXXXXXX"
# scopes     = ["read", "write", "manage"]
# label      = "viewport"
# agent_name = "viewport"
#
# Agents that curate the corpus get `manage`; daemons that only write
# their own records (scanner, kmon) deliberately do not — they can
# still retract their OWN chunks with `write` alone.
# [[auth.tokens]]
# token      = "ghcp-write-XXXXXXXXXXXXXXXX"
# scopes     = ["read", "write", "manage"]
# label      = "ghcp"
# agent_name = "ghcp"
#
# `agent_name` is what makes a token an identity: memory_delete
# decides ownership by it, so a token without one cannot delete.
# [[auth.tokens]]
# token      = "scanner-XXXXXXXXXXXXXXXXXXXX"
# scopes     = ["read", "write"]
# label      = "scanner"
# agent_name = "klams-scanner"
#
# [[auth.tokens]]
# token  = "ken-admin-XXXXXXXXXXXXXXXXXX"
# scopes = ["read", "write", "manage", "admin"]
# label  = "ken-admin"
#
# Sprint 015 — the klams-mind companion gets its own read+write grant.
# `agent_name` binds REST writes to the klams-mind author (sprint 009);
# MCP writes attribute via its register_author identity.
# [[auth.tokens]]
# token      = "klams-mind-XXXXXXXXXXXXXXXX"
# scopes     = ["read", "write"]
# label      = "klams-mind"
# agent_name = "klams-mind"

[postgres]
url = "postgres://klams:changeme@127.0.0.1:5432/klams"
max_connections = 8

[qdrant]
# gRPC endpoint. Loopback because Qdrant is bound to 127.0.0.1:6334
# by the Compose stack.
grpc_url = "http://127.0.0.1:6334"
# Sprint 028 rebuilt the corpus into "knowledge_items_v2" (Qwen3,
# 1024-dim). Sprint 032 (#647): this line still said "knowledge_items",
# so a rebuild from this example provisioned the RETIRED collection at
# the wrong vector width — the comment above it already described the
# drift without fixing it. The v1 collection was dropped in 032 (#684).
collection = "knowledge_items_v2"

[embeddings]
# Embedding endpoint. `api` selects the wire dialect (sprint 014):
#   "tei"    — TEI-native POST /embed; `url` is the TEI base.
#   "openai" — OpenAI-compat POST {url}/embeddings (vLLM, TEI's /v1
#              route, Ollama /v1); `url` must include the /v1
#              segment, e.g. "http://127.0.0.1:7070/v1". Set
#              `api_key` for endpoints started with --api-key.
# Loopback in production.
url = "http://127.0.0.1:7070"
# Sprint 028 (#655): Qwen3-Embedding-0.6B at 1024 dims. Sprint 032
# (#647) brought this block in line with the live host — it still
# described bge-small-en-v1.5/384/512, three sprints stale.
model_id = "Qwen/Qwen3-Embedding-0.6B"
vector_dim = 1024
api = "tei"

# The model's maximum input length in TOKENS (sprint 027, #420). This is
# the single ceiling every ingest path gates against — REST
# /memory/knowledge/index, MCP memory_add, and the embedder itself — so
# text the model would refuse is refused at the boundary with an honest
# PAYLOAD_TOO_LARGE naming the limit, instead of being accepted with a
# 202 and dropped later at the worker.
#
# Verify against the live endpoint before changing it:
#   curl -s http://127.0.0.1:7070/info | jq '{max_input_length, auto_truncate}'
#
# Qwen3-Embedding-0.6B reports 32768 (verified live via /info). Do NOT
# translate a token budget into a character count: measured on the
# previous model, 512 tokens bought ~525 characters of
# punctuation-dense text but >20,000 of base64 — a 32x spread. The
# service asks TEI's /tokenize for the exact count rather than
# estimating. Keep the scanner's matching `max_input_tokens` in
# scanner.example.toml in step with this value.
#
# Leave `auto_truncate` OFF at the TEI container. A silently truncated
# chunk looks complete but is unfindable by its tail; a visible rejection
# is strictly better. NOTE: TEI ≥1.8 flipped the default to ON — the
# compose command passes an explicit `--auto-truncate false`.
max_input_tokens = 32768

# Prefix prepended to QUERY text before embedding — never to stored
# documents (sprint 028 #655). Modern retrieval models are asymmetric:
#   snowflake-arctic-embed-*  →  "query: "
#   Qwen3-Embedding-*         →  "Instruct: Given a web search query,
#                                 retrieve relevant passages that answer
#                                 the query\nQuery: "
# Leave empty (default) for symmetric models (bge-m3, bge-small).
query_prefix = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "

# Retention for the oversize-write log (sprint 027, #656), which records
# refused knowledge writes INCLUDING the full submitted text so "what did
# we lose, how often, and to whom" is answerable. Because it stores whole
# payloads it is pruned on a daily timer rather than left to grow.
oversize_log_retention_days = 90

[queue]
# Bounded mpsc capacity for the worker pool. When full, the API
# returns 503 with Retry-After.
capacity = 1024
workers = 4

[logging]
# "json" routes through the JSON tracing formatter for journald.
# "pretty" is intended for dev.
format = "json"
level = "info"

# [decay]
# Background decay task (sprint 002). Defaults are baked into the
# binary; this block exists so operators can see the knobs without
# spelunking through code. Uncomment and edit to override.
#
# task_interval_seconds = 3600   # how often the decay task ticks
# batch_size            = 500    # facts updated per transaction
#
# Per-FactType lambda values (decay rate). Larger = decays faster.
# Defaults: UserFact = 1e-9, TaskFact = 1e-6, EnvFact = 1e-9.
[decay.lambda]
UserFact = 1e-9
TaskFact = 1e-6
EnvFact  = 1e-9

# ---------------------------------------------------------------------------
# Sprint 005 (Phase 4) — advanced retrieval, summarization, token accounting.
# ---------------------------------------------------------------------------

[retrieval]
# Fusion strategy for hybrid retrieval. "rrf" (default) is
# Reciprocal Rank Fusion: score(d) = Σ_s 1 / (k + rank_s(d)).
# "weighted" uses per-source weights with normalization.
#
# SCOPE (sprint 032, #648): `fusion` / `rrf_k` / the [retrieval.weights]
# table are honoured by MCP `memory_search` and by `/memory/context`.
# REST `GET /memory/search` does NOT read them — it calls
# `FusionStrategy::default_rrf()` unconditionally
# (crates/klams-api/src/handlers/search.rs), so it always fuses with
# plain RRF at k=60 no matter what is set here. Setting
# `fusion = "weighted"` therefore changes MCP results and leaves the
# REST endpoint alone. Documented rather than wired because this sprint
# is retrieval-neutral by contract; wiring it is a ranking change and
# needs the eval gate.
fusion           = "rrf"
rrf_k            = 60       # used when fusion = "rrf"
per_source_top_k = 100      # each retrieval source returns top-k before fusion

# Used only when fusion = "weighted":
# [retrieval.weights]
# vector = 1.0
# fts    = 1.0
# normalization = "zscore"  # "zscore" | "minmax"

# Sprint 030 (#685): optional second-stage cross-encoder for
# memory_search — the `reranker` compose service. Absent = stage off
# (that is the rollback switch; the stage is also best-effort at
# runtime, so a sick reranker only costs the reorder, never the
# search). rerank_window must stay <= the container's
# --max-client-batch-size (compose serves 64).
# reranker_url  = "http://127.0.0.1:7071"
# rerank_window = 50

[tokens]
# Token-cost estimator for /memory/context budget accounting.
# "tiktoken" uses cl100k_base (matches OpenAI/Anthropic chat tokenizers).
# "fallback" uses chars/4 — use this when tiktoken data files are absent.
mode = "tiktoken"

[summarization]
# Background summarization task. When disabled, /memory/context still
# works — it just falls back to raw items + truncation.
#
# Sprint 032 (#647/#335) removed the LLM keys (`llm_fallback`,
# `llm_url`, `llm_model`, `llm_api_key`, and the `ollama_url` /
# `ollama_model` aliases) and the never-read knowledge-digest keys
# (`knowledge_stale_days`, `knowledge_cluster_min`). Summaries are
# extractive, full stop — the "LLM fallback" only ever pinged
# {llm_url}/models and relabelled the extractive output, and its
# default endpoint (Ollama on 127.0.0.1:11434) is deployed nowhere.
# Configs that still carry the old keys keep booting; they are ignored.
enabled                = true
event_cluster_min      = 50     # min events per (host, category, day_bucket) to summarize
task_interval_seconds  = 3600

# ---------------------------------------------------------------------------
# Sprint 006 (Phase 5) — maintenance window + backups.
# ---------------------------------------------------------------------------
#
# Disabled by default. To enable nightly backups: uncomment, set
# `enabled = true`, point `backup_dir` at a writable filesystem path
# (typically a NAS mount), and pick a UTC `window_start_utc`.
#
# NOTE: when enabled, the service REFUSES to start if backup_dir is
# missing. If it lives on a network mount, use x-systemd.automount in
# fstab and add RequiresMountsFor=<backup_dir> to the unit so it self-
# heals when the NAS comes up after the host.
#
# [backup]
# enabled              = false                  # master switch; default off
# backup_dir           = "/gratch/klams-backup"    # written atomically via .partial -> rename
# window_start_utc     = "07:00"                # HH:MM, UTC only (no DST drift)
# daily_count          = 14                     # newest N distinct dates per kind
# weekly_count         = 4                      # newest N Sundays per kind
# same_day_strategy    = "suffix"               # "suffix" (default) | "overwrite"
# status_hook          = "/usr/local/bin/klams-backup-shim"  # optional executable
# status_hook_timeout  = "10s"                  # bounded; misbehaving hook can't stall a backup


