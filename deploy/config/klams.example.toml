# klams-service runtime configuration.
#
# Copy to $KLAMS_ROOT/config/klams.toml (provision script does this)
# and point the systemd unit's EnvironmentFile at it via KLAMS_CONFIG.

[server]
# Bind address for the HTTP API. Loopback by default; the systemd
# unit binds to a LAN interface in production.
listen_addr = "127.0.0.1"
port = 7777

[auth]
# 32-byte hex token. Generated and written by the provision script.
# Treat as a secret; constant-time compared.
bearer_token = "changeme-rendered-by-provision-script"

[postgres]
url = "postgres://klams:changeme@127.0.0.1:5432/klams"
max_connections = 8

[qdrant]
# gRPC endpoint. Loopback because Qdrant is bound to 127.0.0.1:6334
# by the Compose stack.
grpc_url = "http://127.0.0.1:6334"
collection = "knowledge_items"

[embeddings]
# TEI inference server. Loopback in production.
url = "http://127.0.0.1:7070"
model_id = "BAAI/bge-small-en-v1.5"
vector_dim = 384

[queue]
# Bounded mpsc capacity for the worker pool. When full, the API
# returns 503 with Retry-After.
capacity = 1024
workers = 4

[logging]
# "json" routes through the JSON tracing formatter for journald.
# "pretty" is intended for dev.
format = "json"
level = "info"

# [decay]
# Background decay task (sprint 002). Defaults are baked into the
# binary; this block exists so operators can see the knobs without
# spelunking through code. Uncomment and edit to override.
#
# task_interval_seconds = 3600   # how often the decay task ticks
# batch_size            = 500    # facts updated per transaction
#
# Per-FactType lambda values (decay rate). Larger = decays faster.
# Defaults: UserFact = 1e-9, TaskFact = 1e-6, EnvFact = 1e-9.
[decay.lambda]
UserFact = 1e-9
TaskFact = 1e-6
EnvFact  = 1e-9

# ---------------------------------------------------------------------------
# Sprint 005 (Phase 4) — advanced retrieval, summarization, token accounting.
# ---------------------------------------------------------------------------

[retrieval]
# Fusion strategy for hybrid retrieval. "rrf" (default) is
# Reciprocal Rank Fusion: score(d) = Σ_s 1 / (k + rank_s(d)).
# "weighted" uses per-source weights with normalization.
fusion           = "rrf"
rrf_k            = 60       # used when fusion = "rrf"
per_source_top_k = 100      # each retrieval source returns top-k before fusion

# Used only when fusion = "weighted":
# [retrieval.weights]
# vector = 1.0
# fts    = 1.0
# normalization = "zscore"  # "zscore" | "minmax"

[tokens]
# Token-cost estimator for /memory/context budget accounting.
# "tiktoken" uses cl100k_base (matches OpenAI/Anthropic chat tokenizers).
# "fallback" uses chars/4 — use this when tiktoken data files are absent.
mode = "tiktoken"

[summarization]
# Background summarization task. When disabled, /memory/context still
# works — it just falls back to raw items + truncation.
enabled                = true
event_cluster_min      = 50     # min events per (host, category, day_bucket) to summarize
knowledge_stale_days   = 90     # last_used_at AND updated_at older than this = stale
knowledge_cluster_min  = 20     # min stale chunks per (repo, file_prefix) cluster
llm_fallback           = true   # use Ollama Phi-3-medium when extractive output is inadequate
ollama_url             = "http://127.0.0.1:11434"
ollama_model           = "phi3:medium"
task_interval_seconds  = 3600

# ---------------------------------------------------------------------------
# Sprint 006 (Phase 5) — maintenance window + backups.
# ---------------------------------------------------------------------------
#
# Disabled by default. To enable nightly backups: uncomment, set
# `enabled = true`, point `backup_dir` at a writable filesystem path
# (typically a NAS mount), and pick a UTC `window_start_utc`.
#
# [backup]
# enabled              = false                  # master switch; default off
# backup_dir           = "/ai/klams/backups"    # written atomically via .partial -> rename
# window_start_utc     = "07:00"                # HH:MM, UTC only (no DST drift)
# daily_count          = 14                     # newest N distinct dates per kind
# weekly_count         = 4                      # newest N Sundays per kind
# same_day_strategy    = "suffix"               # "suffix" (default) | "overwrite"
# status_hook          = "/usr/local/bin/klams-backup-shim"  # optional executable
# status_hook_timeout  = "10s"                  # bounded; misbehaving hook can't stall a backup


