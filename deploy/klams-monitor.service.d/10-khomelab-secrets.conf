# Sprint 051 — klams-monitor takes the central Redis password from the
# per-host secrets file k-homelab renders, instead of keeping a private copy
# of it in /etc/klams/monitor.env.
#
# install-systemd.sh installs this drop-in only on a host that already has
# /etc/khomelab/secrets.env, so the shipped unit stays startable on a host
# that has never heard of k-homelab.
#
# No leading `-`, deliberately (simplify-secrets convention 7). REDISCLI_AUTH
# is the only thing between the kpidash reporter and an unauthenticated
# connection to rpi53's Redis: without it the monitor keeps running, fails
# every publish, and reports nothing. A unit that refused to start is the
# honest account of a missing secrets file; a silent non-publisher is not.
# Consequence the changeover (korg:2436) needs: on a host carrying this
# drop-in, klams-monitor HARD-FAILS if /etc/khomelab/secrets.env is missing.
#
# No SupplementaryGroups=khomelab, also deliberately (convention 1, measured
# on systemd 259): systemd reads EnvironmentFile= as PID 1 before dropping to
# User=klams, so no group membership is needed — and naming a group the host
# lacks makes the unit fail to start.
[Service]
EnvironmentFile=/etc/khomelab/secrets.env
