# klams backing-services stack (postgres, qdrant, embedder, reranker).
#
# All services attach to the single user-defined bridge network
# `klams-net` with DNS aliases matching the service name. See
# sprints/001-initial-mvp/research.md §13.
#
# All persistent data is bind-mounted under ${KLAMS_DATA_ROOT}
# (default /ai/klams/data; provisioned by scripts/provision-storage-root.sh).
# Image tags are pinned via compose.env so updates are an env-file change.
#
# klams-service itself runs under systemd; a commented-out service
# block is provided below for developers who prefer a Compose-only loop.

networks:
  klams-net:
    name: klams-net
    driver: bridge

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: klams-postgres
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [postgres]
    environment:
      POSTGRES_DB: klams
      POSTGRES_USER: klams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${KLAMS_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klams -d klams"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG}
    container_name: klams-qdrant
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [qdrant]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${KLAMS_DATA_ROOT}/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG}
    container_name: klams-tei
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [tei]
    # Sprint 028 (#655): flags are explicit because TEI changed the
    # auto-truncate DEFAULT to true in 1.9 — a silently truncated chunk
    # looks complete but is unfindable by its tail, strictly worse than
    # a visible rejection (standing decision, sprints 027/028). If this
    # command runs against a pre-1.8 image (rollback), drop the
    # "--auto-truncate false" pair: old clap treated it as a switch.
    # --max-batch-tokens must be >= the model's max input length when
    # auto-truncate is off — TEI refuses to start otherwise (which is
    # the honest failure; do not "fix" it by enabling truncation).
    # 32768 matches Qwen3-Embedding's context.
    command:
      [
        "--model-id", "${TEI_MODEL_ID}",
        "--port", "80",
        "--auto-truncate", "false",
        "--max-batch-tokens", "32768",
        "--max-client-batch-size", "64",
      ]
    ports:
      - "127.0.0.1:7070:80"
    volumes:
      - ${KLAMS_DATA_ROOT}/tei:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG}
    container_name: klams-reranker
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [reranker]
    # Sprint 030 (#685): second-stage cross-encoder for memory_search.
    # --auto-truncate is ON here — the OPPOSITE of the embedder above,
    # deliberately: this container only *scores* (query, text) pairs, so
    # a truncated input degrades one ranking signal gracefully, whereas
    # a rejection kills the whole rerank stage for one oversized chunk.
    # The embedder's rule exists because silently-truncated *stored*
    # content becomes unfindable; nothing is stored here.
    # --max-client-batch-size 64 must stay >= [retrieval] rerank_window
    # (default 50) — TEI 422s a larger batch outright.
    command:
      [
        "--model-id", "${RERANKER_MODEL_ID}",
        "--port", "80",
        "--auto-truncate",
        "--max-client-batch-size", "64",
      ]
    ports:
      - "127.0.0.1:7071:80"
    volumes:
      - ${KLAMS_DATA_ROOT}/tei:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  # --- klams-service (Compose-mode dev convenience; usually systemd) ---
  # klams:
  #   image: klams:dev
  #   container_name: klams
  #   restart: unless-stopped
  #   networks:
  #     klams-net:
  #       aliases: [klams]
  #   environment:
  #     KLAMS_CONFIG: /etc/klams/klams.toml
  #     KLAMS_LOG_FORMAT: json
  #   volumes:
  #     - ${KLAMS_ROOT}/config/klams.toml:/etc/klams/klams.toml:ro
  #   ports:
  #     - "127.0.0.1:7777:7777"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     qdrant:   { condition: service_healthy }
  #     tei:      { condition: service_healthy }

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v2.55.0}
    container_name: klams-prometheus
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [prometheus]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${KLAMS_DATA_ROOT}/prometheus:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.2.2}
    container_name: klams-grafana
    restart: unless-stopped
    networks:
      klams-net:
        aliases: [grafana]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ${KLAMS_DATA_ROOT}/grafana:/var/lib/grafana
      - ./grafana/klams.json:/var/lib/grafana/dashboards/klams.json:ro
    depends_on:
      prometheus:
        condition: service_started
