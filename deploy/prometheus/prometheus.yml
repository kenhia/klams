global:
  # KEEP THIS BELOW 30s. klams-service's hyper `header_read_timeout`
  # defaults to 30s and (hyper 1.x) re-arms on every request head, so it
  # FINs an idle pooled connection at exactly that mark. A scrape interval
  # at or above 30s puts the next scrape and that FIN on top of each other;
  # when they cross, Prometheus writes to a closing socket and the scrape
  # fails. That is WI 1806 — it cost the kpidash health card months of
  # intermittent "Unreachable" and a packet capture to diagnose — and at 30s
  # it reproduces here, on the metrics path.
  #
  # 15s is what makes this safe, and the safety is accidental rather than
  # designed: under 30s the connection is never idle long enough to be
  # reaped. Raising it is not a tuning decision, it is re-opening a fixed
  # bug. If you need a slower scrape, give `/metrics` the same
  # `Connection: close` treatment `/healthz` has rather than retuning the
  # server timeout — retuning only relocates the collision to whatever
  # cadence matches the new number. See docs/architecture.md §4.1.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance: klams

# NOTE: This is the sample config for the *bundled* compose stack in this repo
# (Prometheus + klams-service in the same docker-compose network), where the
# service is reachable as `host.docker.internal:7777` from the Prometheus
# container.
#
# If your Grafana/Prometheus run on a separate host, scrape the service on
# its real host:port via a `klams-service` job whose target resolves through
# the Prometheus container's `extra_hosts`. Keep the job name + labels
# identical (`job=klams-service`, `service=klams-service`) so the shared
# dashboard (`deploy/grafana/klams.json`) works against either Prometheus.
scrape_configs:
  - job_name: klams-service
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Bundled-compose target. For a host-network deployment use the
      # actual service host:port instead.
      - targets:
          - host.docker.internal:7777
        labels:
          service: klams-service

  # Optional: scrape klams-monitor when enabled and exposing metrics.
  # - job_name: klams-monitor
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["klams-monitor:7780"]
