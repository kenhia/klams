global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance: klams

# NOTE: This is the sample config for the *bundled* compose stack in this repo
# (Prometheus + klams-service in the same docker-compose network), where the
# service is reachable as `host.docker.internal:7777` from the Prometheus
# container.
#
# If your Grafana/Prometheus run on a separate host, scrape the service on
# its real host:port via a `klams-service` job whose target resolves through
# the Prometheus container's `extra_hosts`. Keep the job name + labels
# identical (`job=klams-service`, `service=klams-service`) so the shared
# dashboard (`deploy/grafana/klams.json`) works against either Prometheus.
scrape_configs:
  - job_name: klams-service
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Bundled-compose target. For a host-network deployment use the
      # actual service host:port instead.
      - targets:
          - host.docker.internal:7777
        labels:
          service: klams-service

  # Optional: scrape klams-monitor when enabled and exposing metrics.
  # - job_name: klams-monitor
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["klams-monitor:7780"]
