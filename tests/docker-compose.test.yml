# Ephemeral test stack for integration tests.
# Brought up by tests via `docker compose -f tests/docker-compose.test.yml up -d`.
# Uses a dedicated user-defined bridge network so containers can address
# each other by service name (postgres, qdrant, tei) inside the network,
# while the host accesses them on the published ports below.
name: klams-test

networks:
  klams-test-net:
    driver: bridge

volumes:
  klams-test-pg: {}
  klams-test-qdrant: {}
  klams-test-tei: {}
  klams-test-reranker: {}

services:
  postgres:
    image: postgres:16
    networks: [klams-test-net]
    environment:
      POSTGRES_USER: klams
      POSTGRES_PASSWORD: klams_test
      POSTGRES_DB: klams
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - klams-test-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klams"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.18.0
    networks: [klams-test-net]
    ports:
      - "127.0.0.1:56333:6333"
      - "127.0.0.1:56334:6334"
    volumes:
      - klams-test-qdrant:/qdrant/storage
    # The qdrant image ships no HTTP client (no curl/wget/nc/python3), so
    # the obvious `curl /readyz` probe can never pass and the container
    # reports "unhealthy" forever (#672). It does ship bash, so speak
    # HTTP over /dev/tcp instead. Keep the SINGLE quotes: in a YAML
    # double-quoted scalar the \r\n would be converted to real control
    # characters before printf ever sees them.
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3']
      interval: 2s
      timeout: 3s
      retries: 30

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    networks: [klams-test-net]
    # bge-small-en-v1.5 (384-dim) is NOT the production embedder
    # (Qwen3-Embedding-0.6B, 1024-dim, since sprint 028). This is a
    # decision, not drift (#732): the stack must embed at CPU speed on
    # GitHub runners, and Qwen3-0.6B cannot. Everything dim-shaped in
    # the suite follows TEST_EMBED_DIM in
    # crates/klams-service/tests/common/mod.rs — change the model here
    # and there together. The production 1024/prefix contract is pinned
    # hermetically in klams-store (embeddings.rs, composite.rs) and
    # klams-service (config.rs example-toml test).
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "127.0.0.1:57070:80"
    volumes:
      - klams-test-tei:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    networks: [klams-test-net]
    # Sprint 036 (#731): the live-rerank integration test
    # (crates/klams-service/tests/mcp_rerank.rs) self-skipped forever
    # because no documented path provided TEST_RERANKER_URL. Same
    # smaller-than-production rule as the embedder above: production
    # serves BAAI/bge-reranker-v2-m3 (deploy/compose.env.example); this
    # stack scores a handful of pairs on CPU, so the base model is
    # plenty and pulls far less. The flags mirror the deploy compose
    # (deploy/docker-compose.yml `reranker`): --auto-truncate because
    # this container only scores pairs, and --max-client-batch-size
    # must stay >= [retrieval] rerank_window (default 50).
    command:
      [
        "--model-id", "BAAI/bge-reranker-base",
        "--auto-truncate",
        "--max-client-batch-size", "64",
      ]
    ports:
      - "127.0.0.1:57071:80"
    volumes:
      - klams-test-reranker:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 60
