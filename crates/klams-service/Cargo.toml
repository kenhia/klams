[package]
name = "klams-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "klams_service"
path = "src/lib.rs"

[[bin]]
name = "klams-service"
path = "src/main.rs"

[features]
# Enables the Day-0 sizing fixture loader (sprint 006 T014). Gated
# off by default so the multi-minute load does not run with
# `cargo test --workspace`.
scale-fixture = []

[dependencies]
klams-types = { workspace = true }
klams-core = { workspace = true }
klams-store = { workspace = true }
klams-api = { workspace = true }
klams-mcp = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ulid = "1"
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
klams-client = { workspace = true }
klams-scanner = { path = "../klams-scanner" }
tempfile = "3"
filetime = "0.2"
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = "0.15"
sqlx = { workspace = true }
time = { workspace = true }
jsonschema = { version = "0.18", default-features = false }
ulid = "1"
qdrant-client = { workspace = true }
yaml-rust2 = "0.11.0"
