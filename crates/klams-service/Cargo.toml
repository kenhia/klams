[package]
name = "klams-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "klams_service"
path = "src/lib.rs"

[[bin]]
name = "klams-service"
path = "src/main.rs"

[features]
# Enables the Day-0 sizing fixture loader (sprint 006 T014). Gated
# off by default so the multi-minute load does not run with
# `cargo test --workspace`.
scale-fixture = []

[dependencies]
klams-types = { workspace = true }
klams-core = { workspace = true }
klams-store = { workspace = true }
klams-api = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
ulid = "1"

[dev-dependencies]
klams-client = { workspace = true }
klams-scanner = { path = "../klams-scanner" }
tempfile = "3"
filetime = "0.2"
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = "0.15"
sqlx = { workspace = true }
time = { workspace = true }
