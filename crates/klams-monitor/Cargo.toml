[package]
name = "klams-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "klams-monitor"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["kpidash"]
# Health reporting to the kpidash Redis dashboard. Compiled by default so it
# never bit-rots, but entirely inert at runtime unless a `[kpidash]` config
# section is present — a fresh clone with no Redis server never connects.
kpidash = ["dep:redis"]

[dependencies]
klams-types = { workspace = true }
klams-client = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
which = "6"
