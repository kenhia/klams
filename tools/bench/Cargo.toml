[package]
name = "klams-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Sprint 008 — non-shipping perf fixture + harness for `memory_search`
# (FR-019..FR-022). Workspace member so `cargo check --workspace` and
# `just gate` keep it compilable, but no production binary depends on
# it.

[lib]
path = "src/lib.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "run"
path = "src/bin/run.rs"

[lints]
workspace = true

[dependencies]
klams-types = { workspace = true }
klams-client = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
hdrhistogram = "7"
