[package]
name = "klams-soak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "klams-soak"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util", "process", "sync"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
humantime = "2"
